# Culprit fault-injection harness profile — STANDALONE (not an overlay of
# docker-compose.yml: compose concatenates `ports` across -f files, so overlaying
# the base's 8000:8000 would double-bind host 8000 and fail). Run explicitly:
#
#   docker compose -f docker-compose.harness.yml up -d
#
# Production-faithful: gunicorn (3 workers x 2 threads, 120s timeout) on :80,
# published to host :8000; DEBUG=False harness settings; Redis + cachalot ON;
# db healthcheck re-enabled. Own project name + container names so it never
# collides with the dev `thecourseforum2` project.
name: culprit-harness

services:
  web:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    # Explicit prod-style startup (gunicorn :80). NOTE: runs NO migrations —
    # same as prod, where migrate runs in a one-off release task. The scenario
    # runner runs the release task explicitly (plan decision 7).
    command: ["bash", "scripts/container-startup.sh"]
    environment:
      - DJANGO_SETTINGS_MODULE=tcf_core.settings.harness
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://culprit_redis:6379
      - SECRET_KEY=${SECRET_KEY}
      # Sentry passthrough (empty until Task 4 — harness.py is DSN-gated).
      - SENTRY_DSN=${SENTRY_DSN:-}
      - SENTRY_RELEASE=${SENTRY_RELEASE:-}
    volumes:
      # Bind-mount the working tree so materialized fault commits take effect on
      # container recreate WITHOUT an image rebuild (fast per-scenario iteration).
      - .:/app
      - /app/db/  # exclude db subfolder (matches dev compose)
      - harness_node_modules:/app/node_modules
    ports:
      - "8000:80"
    container_name: culprit_web
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # Overridable — the gunicorn-worker-oom infra fault tightens this.
          memory: ${CULPRIT_WEB_MEM:-2g}

  db:
    image: postgres:17.5
    container_name: culprit_db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      # Named volume so the seed survives container removal (the dev profile's
      # tcf_db keeps data only in its writable layer — a data-loss trap).
      - culprit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7
    container_name: culprit_redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  culprit_pgdata:
  harness_node_modules:
